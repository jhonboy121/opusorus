[package]
name = "opusorus-oracle"
description = "Test-only FFI bindings to the vendored C libopus v1.6.1, used as the reference oracle."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false
build = "build.rs"
links = "opus"

[features]
# Mirrors opusorus features so oracle and port are always built in the same configuration.
qext = []
custom-modes = []
# Fixed-point libopus (`FIXED_POINT`, SILK `silk/fixed`, float API kept on as upstream's default)
# and its 24-bit internal resolution variant (`ENABLE_RES24`). Replaces the float oracle.
fixed-point = []
fixed-res24 = ["fixed-point"]
# DNN features: build libopus with the matching --enable-* defines and the model data from
# scripts/fetch_dnn_models.sh.
deep-plc = []
dred = ["deep-plc"]
osce = ["deep-plc"]

[build-dependencies]
cc = "1"

[lints.rust]
# This crate exists to call C; unsafe is expected but must be documented.
unsafe_op_in_unsafe_fn = "deny"
missing_debug_implementations = "warn"

[lints.clippy]
all = { level = "warn", priority = -1 }
undocumented_unsafe_blocks = "warn"
allow_attributes_without_reason = "warn"
