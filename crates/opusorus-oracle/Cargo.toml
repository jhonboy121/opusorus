[package]
name = "opusorus-oracle"
description = "Test-only FFI bindings to the vendored C libopus v1.6.1, used as the reference oracle."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false
build = "build.rs"
links = "opus"

[features]
# Mirrors opusorus features so oracle and port are always built in the same configuration.
qext = []
custom-modes = []
# Fixed-point libopus (`FIXED_POINT`, SILK `silk/fixed`, float API kept on as upstream's default)
# and its 24-bit internal resolution variant (`ENABLE_RES24`). Replaces the float oracle.
fixed-point = []
fixed-res24 = ["fixed-point"]
# `DISABLE_FLOAT_API` (fixed-point only, as upstream; `src/analysis.c` + `mlp*.c` are not built;
# shims marked `// oracle-requires: float-api` are left out) and `FIXED_DEBUG` (the checking
# `celt/fixed_debug.h` + `silk/MacroDebug.h` macros; their messages are captured by
# `csrc/fixed_debug.c`).
disable-float-api = []
fixed-point-debug = ["fixed-point"]
# DNN features: build libopus with the matching --enable-* defines and the model data from
# scripts/fetch_dnn_models.sh.
deep-plc = []
dred = ["deep-plc"]
osce = ["deep-plc"]
# libopus `--enable-dnn-debug-float`: DISABLE_DEBUG_FLOAT is not defined, so the model tables
# keep float copies of the int8 layers and the DNN computes with them.
dnn-debug-float = []
# libopus `--enable-osce-training-data` (ENABLE_OSCE_TRAINING_DATA, implies OSCE): the encoder
# and the OSCE enhancer dump training features into files in the working directory.
osce-training-data = ["osce"]
# The packet loss generator of `--enable-lossgen` (dnn/lossgen.c + lossgen_data.c, which upstream
# links into opus_demo only), reached through the `csrc/dnn_lossgen.c` shim.
lossgen = []
# FLOAT_APPROX, ENABLE_ASSERTIONS, FUZZING, DISABLE_UPDATE_DRAFT.
float-approx = []
assertions = []
fuzzing = []
disable-rfc8251 = []

[build-dependencies]
cc = "1"

[lints.rust]
# This crate exists to call C; unsafe is expected but must be documented.
unsafe_op_in_unsafe_fn = "deny"
missing_debug_implementations = "warn"

[lints.clippy]
all = { level = "warn", priority = -1 }
undocumented_unsafe_blocks = "warn"
allow_attributes_without_reason = "warn"
