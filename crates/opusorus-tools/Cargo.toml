[package]
name = "opusorus-tools"
description = "Command-line tools ported from libopus v1.6.1 (opus_demo, opus_compare, qext_compare) and their library core."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
publish = false

[features]
# Opus HD: `qext_compare`, which needs the QEXT-only `celt::mini_kfft` port, and 96 kHz / `-qext`
# in `opus_demo` (libopus `ENABLE_QEXT`).
# Not on by default: enabling `opusorus/qext` unconditionally would unify it into every workspace
# build (`cargo test --workspace`) while the C oracle stays non-QEXT.
qext = ["opusorus/qext"]
# Fixed-point build of `opusorus` (docs/FIXED_POINT.md): `opus_demo` on the fixed-point codec,
# like upstream's tools in a `--enable-fixed-point` build (the compare tools are float code).
fixed-point = ["opusorus/fixed-point"]
fixed-res24 = ["fixed-point", "opusorus/fixed-res24"]
# DNN features of `opus_demo` (libopus `--enable-deep-plc` / `--enable-dred` / `--enable-osce`):
# deep PLC at `-dec_complexity` >= 5, DRED decoding (`opus_dred_parse` +
# `opus_decoder_dred_decode24` after losses) and `-enable_osce_bwe`. The weights are read from
# `weights_blob.bin` in the working directory (libopus `USE_WEIGHTS_FILE`), or compiled in with
# `dnn-weights-embedded` (like a default libopus DNN build; needs `OPUSORUS_DNN_BLOB`, see
# `scripts/gen_dnn_blob.sh`).
deep-plc = ["opusorus/deep-plc"]
dred = ["opusorus/dred", "deep-plc"]
osce = ["opusorus/osce", "deep-plc"]
dnn-weights-embedded = ["opusorus/dnn-weights-embedded"]

[dependencies]
# `internals` exposes `opusorus::celt::mini_kfft` and `opusorus::math`; `std` selects the platform
# libm, which the C tools also use (required for bit-exact output).
opusorus = { workspace = true, features = ["internals", "std"] }

[[bin]]
name = "opus_demo"
path = "src/bin/opus_demo.rs"

[[bin]]
name = "opus_compare"
path = "src/bin/opus_compare.rs"

[[bin]]
name = "qext_compare"
path = "src/bin/qext_compare.rs"
required-features = ["qext"]

[lints]
workspace = true
