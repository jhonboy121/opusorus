[package]
name = "opusorus-tools"
description = "Command-line tools ported from libopus v1.6.1 (opus_compare, qext_compare) and their library core."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
publish = false

[features]
# Opus HD quality comparison (`qext_compare`), which needs the QEXT-only `celt::mini_kfft` port.
# Not on by default: enabling `opusorus/qext` unconditionally would unify it into every workspace
# build (`cargo test --workspace`) while the C oracle stays non-QEXT.
qext = ["opusorus/qext"]

[dependencies]
# `internals` exposes `opusorus::celt::mini_kfft` and `opusorus::math`; `std` selects the platform
# libm, which the C tools also use (required for bit-exact output).
opusorus = { workspace = true, features = ["internals", "std"] }

[[bin]]
name = "opus_compare"
path = "src/bin/opus_compare.rs"

[[bin]]
name = "qext_compare"
path = "src/bin/qext_compare.rs"
required-features = ["qext"]

[lints]
workspace = true
