[package]
name = "opusorus-bench"
description = "Criterion benchmarks: opusorus vs the scalar C oracle vs an optimized upstream libopus build, plus a markdown report."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[features]
# Adds the 96 kHz Opus HD (QEXT) encode/decode benchmarks (all three implementations built with
# QEXT; upstream CMake has no QEXT switch, so the optimized build gets -DENABLE_QEXT).
qext = ["opusorus/qext", "opusorus-oracle/qext", "opus-sys-optimized/qext"]
# libopus `--enable-float-approx` (`FLOAT_APPROX`) in all three implementations (CMake
# `OPUS_FLOAT_APPROX=ON` for the optimized build).
float-approx = [
    "opusorus/float-approx",
    "opusorus-oracle/float-approx",
    "opus-sys-optimized/float-approx",
]
# DNN benchmarks (float only): deep PLC under packet loss, LACE/NoLACE (OSCE) and DRED encoding,
# opusorus vs the oracle vs the optimized CMake build, all with the same models (Rust loads the
# oracle's weight blob; both C builds use their compiled-in weights).
dnn = [
    "opusorus/deep-plc",
    "opusorus/dred",
    "opusorus/osce",
    "opusorus-oracle/deep-plc",
    "opusorus-oracle/dred",
    "opusorus-oracle/osce",
    "opus-sys-optimized/dnn",
]
# opusorus with the non-bit-exact `fast` kernels (PLAN D-032); the parity tests do not apply.
fast = ["opusorus/fast"]
# Fixed-point builds (docs/FIXED_POINT.md): opusorus `fixed-point` vs the fixed-point oracle vs
# upstream CMake with `OPUS_FIXED_POINT=ON`; the codec benchmarks use the native 16-bit
# (`fixed-res24`: 24-bit) PCM API, and the Criterion groups get a `fixed_` (`fixed24_`) prefix.
fixed-point = [
    "opusorus/fixed-point",
    "opusorus-oracle/fixed-point",
    "opusorus-conformance/fixed-point",
    "opus-sys-optimized/fixed-point",
]
fixed-res24 = [
    "fixed-point",
    "opusorus/fixed-res24",
    "opusorus-oracle/fixed-res24",
    "opusorus-conformance/fixed-res24",
    "opus-sys-optimized/fixed-res24",
]

[dependencies]
# `internals` exposes the MDCT/FFT/range coder/resampler for the micro benchmarks; `std` selects
# the platform libm (as in the bit-exactness tests).
opusorus = { workspace = true, features = ["internals", "std"] }
opusorus-oracle = { workspace = true }
opusorus-conformance = { path = "../opusorus-conformance" }
opus-sys-optimized = { path = "opt-sys" }
# Parses Criterion's `estimates.json` in `bench_report`.
serde_json = "1.0.151"

[dev-dependencies]
# No plotting/HTML: `bench_report` reads Criterion's JSON estimates instead.
criterion = { version = "0.8.2", default-features = false, features = ["cargo_bench_support"] }

[[bench]]
name = "codec"
harness = false

[[bench]]
name = "micro"
harness = false

[[bin]]
name = "bench_report"
path = "src/bin/bench_report.rs"

[[bin]]
name = "bench_profile"
path = "src/bin/bench_profile.rs"

[lints]
workspace = true
