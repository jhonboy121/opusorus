[package]
name = "opus-sys-optimized"
description = "Benchmark-only FFI to vendored libopus v1.6.1 built with its default optimized CMake Release configuration (symbols prefixed `optopus_`), plus micro-benchmark shims over an oracle-configured scalar copy (prefixed `scalopus_`)."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false
build = "build.rs"
links = "opus_opt"

[features]
# Builds both C libraries with ENABLE_QEXT.
qext = []
# Builds both C libraries as fixed-point libopus: the optimized one with upstream CMake's
# `OPUS_FIXED_POINT=ON` (NEON/SSE intrinsics and RTCD as in the float build, plus the fixed-only
# `silk/fixed` NEON kernels), the scalar one with the oracle's fixed configuration.
fixed-point = []
# 24-bit `opus_res` (`ENABLE_RES24`, autotools' default for fixed-point; CMake never sets it, so
# it is passed in `CMAKE_C_FLAGS` like `ENABLE_QEXT`).
fixed-res24 = ["fixed-point"]
# The DNN features in the optimized library (CMake `OPUS_DEEP_PLC`, `OPUS_DRED`, `OPUS_OSCE`,
# compiled-in weights from the fetched model data, scripts/fetch_dnn_models.sh). Float only.
dnn = []
# `FLOAT_APPROX` in both C libraries (CMake `OPUS_FLOAT_APPROX=ON` for the optimized one).
float-approx = []

[build-dependencies]
cc = { version = "1", features = ["parallel"] }

[lints.rust]
# This crate exists to call C (like opusorus-oracle); unsafe is expected but must be documented.
unsafe_op_in_unsafe_fn = "deny"
missing_debug_implementations = "warn"

[lints.clippy]
all = { level = "warn", priority = -1 }
undocumented_unsafe_blocks = "warn"
allow_attributes_without_reason = "warn"
missing_const_for_fn = "warn"
unwrap_or_default = "warn"
