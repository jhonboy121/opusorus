[package]
name = "opusorus"
description = "Pure safe-Rust port of the Opus audio codec (libopus v1.6.1), bit-exact with the reference."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
keywords = ["opus", "audio", "codec", "celt", "silk"]
categories = ["multimedia::audio", "multimedia::encoding", "no-std"]

[features]
default = ["std"]
# Use std's float math (the platform libm). Required for bit-exactness with the C oracle on the
# same platform. Without it, the pure-Rust `libm` crate is used (no_std).
std = []
# Opus HD / scalable quality extension (libopus `--enable-qext`).
qext = []
# Opus Custom modes (libopus `--enable-custom-modes`).
custom-modes = []
# Deep packet-loss concealment (libopus `--enable-deep-plc`). Weights are loaded at runtime from
# a libopus weight blob (`Decoder::set_dnn_blob`), mirroring upstream `USE_WEIGHTS_FILE`.
deep-plc = []
# Deep REDundancy (libopus `--enable-dred`); implies deep PLC as upstream does.
dred = ["deep-plc"]
# SILK speech enhancement + bandwidth extension (libopus `--enable-osce`).
osce = ["deep-plc"]
# FIXED-POINT BUILD (libopus `--enable-fixed-point`). NOT ADDITIVE: it *replaces* the float
# implementation with the integer one (bit-exact with a libopus fixed-point build), exactly like
# upstream's configure switch. While the fixed-point port is in progress (docs/FIXED_POINT.md),
# enabling it compiles a reduced crate: only the modules already converted are available.
# Cannot be combined with deep-plc/dred/osce (upstream configure refuses it too).
fixed-point = []
# 24-bit internal resolution for the fixed-point build (libopus `ENABLE_RES24`, which upstream
# autotools enables by default for fixed-point builds; `--disable-fixed-res24` turns it off).
fixed-res24 = ["fixed-point"]
# Compiled-in DNN weights (libopus built without `USE_WEIGHTS_FILE`): embeds the weight blob
# at the absolute path given by the `OPUSORUS_DNN_BLOB` environment variable at build time
# (`scripts/gen_dnn_blob.sh` generates one) and binds the models when a decoder, encoder or DRED
# decoder is created. Only has an effect together with `deep-plc`, `dred` or `osce`.
dnn-weights-embedded = []
# Exposes internal modules (unstable, for differential tests and benchmarks only).
internals = []

[dependencies]
libm = { workspace = true }

[lints]
workspace = true
