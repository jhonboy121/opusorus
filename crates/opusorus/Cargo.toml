[package]
name = "opusorus"
description = "Pure safe-Rust port of the Opus audio codec (libopus v1.6.1), bit-exact with the reference."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
keywords = ["opus", "audio", "codec", "celt", "silk"]
categories = ["multimedia::audio", "multimedia::encoding", "no-std"]

[features]
default = ["std"]
# Use std's float math (the platform libm). Required for bit-exactness with the C oracle on the
# same platform. Without it, the pure-Rust `libm` crate is used (no_std).
std = ["fearless_simd/std"]
# Opus HD / scalable quality extension (libopus `--enable-qext`).
qext = []
# Opus Custom modes (libopus `--enable-custom-modes`).
custom-modes = []
# Deep packet-loss concealment (libopus `--enable-deep-plc`). Weights are loaded at runtime from
# a libopus weight blob (`Decoder::set_dnn_blob`), mirroring upstream `USE_WEIGHTS_FILE`.
deep-plc = []
# Deep REDundancy (libopus `--enable-dred`); implies deep PLC as upstream does.
dred = ["deep-plc"]
# SILK speech enhancement + bandwidth extension (libopus `--enable-osce`).
osce = ["deep-plc"]
# FIXED-POINT BUILD (libopus `--enable-fixed-point`). NOT ADDITIVE: it *replaces* the float
# implementation with the integer one (bit-exact with a libopus fixed-point build), exactly like
# upstream's configure switch; the public API is the same (docs/FIXED_POINT.md, crate docs).
# Cannot be combined with deep-plc/dred/osce (upstream configure refuses it too).
fixed-point = []
# 24-bit internal resolution for the fixed-point build (libopus `ENABLE_RES24`, which upstream
# autotools enables by default for fixed-point builds; `--disable-fixed-res24` turns it off).
fixed-res24 = ["fixed-point"]
# Removes the float API (libopus `--disable-float-api` / meson `-Dfloat-api=false` / CMake
# `OPUS_ENABLE_FLOAT_API=OFF`, `DISABLE_FLOAT_API`): no `encode_float` / `decode_float` /
# `pcm_soft_clip` / float `opus_custom_*`, and the encoder's float tonality analysis (src/analysis.c,
# mlp.c) is compiled out, which changes the encoder's decisions (as in libopus). Requires
# `fixed-point` (libopus' float build does not compile with `DISABLE_FLOAT_API`).
disable-float-api = []
# Checking fixed-point arithmetic (libopus `--enable-fixed-point-debug`, `FIXED_DEBUG`): the
# `celt/fixed_debug.h` and `silk/MacroDebug.h` macro versions, which check their operand ranges,
# report violations (the `fixed_debug` module; printed to stderr with `std`) and count operations
# (`celt_mips`). Implies `fixed-point` (CMake ties it to fixed point; the float build does not
# compile with `FIXED_DEBUG`). Slow: for debugging only.
fixed-point-debug = ["fixed-point"]
# Compiled-in DNN weights (libopus built without `USE_WEIGHTS_FILE`): embeds the weight blob
# at the absolute path given by the `OPUSORUS_DNN_BLOB` environment variable at build time
# (`scripts/gen_dnn_blob.sh` generates one) and binds the models when a decoder, encoder or DRED
# decoder is created. Only has an effect together with `deep-plc`, `dred` or `osce`.
dnn-weights-embedded = []
# libopus `--enable-dnn-debug-float` (DISABLE_DEBUG_FLOAT undefined): the model tables keep
# float copies of the int8-quantized layers and the DNN computes with those. Weights loaded at
# runtime carry their own choice (a blob with float copies computes in float, as in C's
# `USE_WEIGHTS_FILE` builds, where the switch has no effect); with `dnn-weights-embedded` it
# requires an embedded blob with the float copies (`scripts/gen_dnn_blob.sh --debug-float`),
# and without it one without (checked at compile time).
dnn-debug-float = []
# libopus `--enable-osce-training-data` (ENABLE_OSCE_TRAINING_DATA, implies OSCE): the encoder
# (VOIP high-pass output, `clean_hp.s16`) and the OSCE enhancer (`features_*.f32/s16/s32`,
# `noisy_16k.s16`) append training data to files in the working directory, like upstream.
# Needs `std`. See `osce_training_data`.
osce-training-data = ["osce", "std"]
# The generative packet loss model of libopus `--enable-lossgen` (dnn/lossgen.c, used by
# `opus_demo -sim_loss`), as `opusorus::lossgen`; its small model is compiled in. Works in
# every build (float or fixed-point, no DNN feature needed).
lossgen = []
# libopus `--enable-float-approx` (`FLOAT_APPROX`): polynomial `celt_log2`/`celt_exp2` and a
# bit-test `celt_isnan` in the float build (no effect with `fixed-point`, as upstream).
float-approx = []
# libopus `--enable-assertions` (`ENABLE_ASSERTIONS`): the libopus internal checks (celt_assert,
# celt_sig_assert, silk_assert) are `assert!`s in every build profile instead of `debug_assert!`s.
assertions = []
# libopus `--enable-fuzzing` (`FUZZING`): the encoder makes random decisions from a process-wide
# glibc-compatible `rand()` (`glibc_rand`). Not for production.
fuzzing = []
# libopus `--disable-rfc8251` (`DISABLE_UPDATE_DRAFT`): the original RFC 6716 decoder behaviour
# (folding, mono phase inversion), without the RFC 8251 bitstream fixes.
disable-rfc8251 = []
# Faster float kernels that are NOT bit-exact with the reference (PLAN D-032): FMA, reassociated
# SIMD reductions and integer accumulation across the int8 blocks of the DNN products (as
# libopus' own NEON/AVX builds do). Output differs from the reference at the rounding level;
# conformance is checked with `opus_compare` and cross-codec tests (`just test-fast`). The
# fixed-point codec is integer and unaffected (only the float lossgen model changes there).
fast = []
# Exposes internal modules (unstable, for differential tests and benchmarks only).
internals = []

[dependencies]
libm = { workspace = true }
# Safe SIMD for the float FFT/MDCT (vertical: bit-identical to the scalar code, docs/PLAN.md D-031).
fearless_simd = { workspace = true }

[lints]
workspace = true
