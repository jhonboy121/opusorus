[package]
name = "opusorus-capi"
description = "Drop-in libopus C ABI (opus.h, opus_multistream.h, opus_projection.h, opus_custom.h) backed by opusorus."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
publish = false
build = "build.rs"

[lib]
# `libopusorus.so` / `libopusorus.a` (+ `.dylib`, `.dll`/`.lib` on other platforms). There is
# deliberately no `rlib`: its uplifted `libopusorus.rlib` would collide with the `opusorus`
# crate's own output in a workspace build.
name = "opusorus"
crate-type = ["cdylib", "staticlib"]

[features]
default = []
# Opus HD (libopus `--enable-qext`): 96 kHz, `OPUS_SET_QEXT`.
qext = ["opus/qext"]
# The `opus_custom.h` API (libopus `--enable-custom-modes`). Needs the CELT layer, which the
# `opusorus` crate only exposes with `internals`.
custom-modes = ["opus/custom-modes", "opus/internals"]
# DNN features: forwarded to `opusorus` (libopus `--enable-deep-plc` / `--enable-dred` /
# `--enable-osce`). The weights are loaded with `OPUS_SET_DNN_BLOB` on the encoder, decoder and
# DRED decoder (libopus `USE_WEIGHTS_FILE`), or compiled in with `dnn-weights-embedded`.
deep-plc = ["opus/deep-plc"]
dred = ["opus/dred"]
osce = ["opus/osce"]
# Fixed-point build of `opusorus` (libopus `--enable-fixed-point`, docs/FIXED_POINT.md): the
# `opus_res` of the C API is `opus_int16` (`opus_int32` with `fixed-res24`, libopus
# `ENABLE_RES24`), `OPUS_SET_ENERGY_MASK` takes Q24 `opus_int32` values, and the float API
# (`opus_encode_float`, `opus_decode_float`, ...) converts like libopus' default fixed build.
# Not combinable with the DNN features (as upstream).
fixed-point = ["opus/fixed-point"]
fixed-res24 = ["fixed-point", "opus/fixed-res24"]
# Compiled-in DNN weights: embeds the blob at `$OPUSORUS_DNN_BLOB` (absolute path, generated by
# `scripts/gen_dnn_blob.sh`) and binds the models at init, like a default libopus DNN build.
dnn-weights-embedded = ["opus/dnn-weights-embedded"]
# libopus `--enable-dnn-debug-float` (float copies of the int8 DNN layers; only changes the
# compiled-in weights of `dnn-weights-embedded`) and `--enable-osce-training-data` (the library
# writes OSCE training files into the working directory).
dnn-debug-float = ["opus/dnn-debug-float"]
osce-training-data = ["opus/osce-training-data"]
# Also exports the libopus-internal helpers that upstream's `test_opus_extensions.c` links
# against (`opus_packet_parse_impl`, `opus_repacketizer_out_range_impl`,
# `opus_packet_extensions_*`). Not part of the libopus ABI; used by `tests/c_suite.rs`.
internal-api = []

[dependencies]
# Renamed: this crate's own library is called `opusorus`.
opus = { package = "opusorus", path = "../opusorus", features = ["std"] }

[build-dependencies]
cc = "1"

# Own lint table: the workspace table forbids `unsafe_code`, which a C ABI cannot avoid.
[lints.rust]
unsafe_op_in_unsafe_fn = "deny"
missing_debug_implementations = "warn"
rust_2018_idioms = { level = "warn", priority = -1 }
unused_qualifications = "warn"

[lints.clippy]
all = { level = "warn", priority = -1 }
undocumented_unsafe_blocks = "deny"
missing_const_for_fn = "warn"
unwrap_used = "warn"
expect_used = "warn"
allow_attributes_without_reason = "warn"
unwrap_or_default = "warn"
dbg_macro = "warn"
todo = "warn"
print_stdout = "warn"
print_stderr = "warn"
